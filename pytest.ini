[pytest]
# 임시 폴더는 저장소 안(.pytest_tmp/, git 제외)에 둔다 — 시스템 Temp 권한 문제 회피.
# 실행마다 `.pytest_tmp/run-<프로세스번호>` 를 쓴다(루트 conftest.py). 여기서 --basetemp 를 하나로 고정하면
# pytest 가 시작할 때 그 폴더를 통째로 비워, 동시에 돌던 다른 실행의 임시 폴더가 사라진다(2026-11-04 실측).
addopts = -p no:cacheprovider
markers =
    slow: 느린 테스트(하위 프로세스 · 생성기 전체 · 실제 DB) — quick 에서 빠지고 전체 test 에서만 돈다(REQ-261104-17)
