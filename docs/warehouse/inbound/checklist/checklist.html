* { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg-canvas); color: var(--color-text-primary);
  font-family: var(--font-family-base); font-size: var(--font-size-md); line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center;
  padding: var(--space-3) var(--space-4); background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-subtle); }
header h1 { font-size: var(--font-size-lg); margin: 0; font-weight: var(--font-weight-bold); }
.grow { flex: 1; }
.bar { height: 8px; width: 140px; background: var(--color-bg-subtle); border-radius: var(--radius-pill); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--color-action-primary); }
.muted { color: var(--color-text-muted); font-size: var(--font-size-sm); }
.btn { border: 1px solid var(--color-border-control); background: var(--color-bg-surface); border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3); cursor: pointer; min-height: 40px; }
.btn:hover { background: var(--color-bg-subtle); }
.btn.primary { background: var(--color-action-primary); color: var(--color-action-on-primary); border-color: transparent; }
.btn.sm { min-height: 32px; padding: 2px var(--space-3); font-size: var(--font-size-sm); }
.seg { display: inline-flex; border: 1px solid var(--color-border-control); border-radius: var(--radius-md); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: var(--space-2) var(--space-3); cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--color-brand-100); color: var(--color-text-brand); font-weight: var(--font-weight-semibold); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--color-brand-dark100); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--color-brand-dark100); } }
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1220px; margin: 0 auto; gap: var(--space-6); padding: var(--space-4); }
.wrap > * { min-width: 0; }
nav ol { list-style: none; margin: 0; padding: 0; position: sticky; top: 76px; max-height: calc(100vh - 90px); overflow-y: auto; }
nav button { width: 100%; text-align: left; display: flex; gap: var(--space-2); align-items: center; border: 0; background: transparent;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; min-height: 38px; }
nav button[aria-current="true"] { background: var(--color-bg-surface); box-shadow: inset 3px 0 0 var(--color-action-primary); font-weight: var(--font-weight-semibold); }
nav .cnt { margin-left: auto; font-size: var(--font-size-xs); color: var(--color-text-muted); }
nav .done .cnt { color: var(--color-status-success-fg); }
nav .off button { color: var(--color-text-muted); text-decoration: line-through; }
section.card { background: var(--color-bg-surface); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); margin-bottom: var(--space-4); }
.sechead { display: flex; gap: var(--space-3); align-items: flex-start; flex-wrap: wrap; }
.sechead h2 { margin: 0; font-size: var(--font-size-xl); }
section.card.off .q { display: none; }
.q { padding: var(--space-4) 0; border-top: 1px solid var(--color-border-subtle); }
.q.first { border-top: 0; }
.qhead { display: flex; gap: var(--space-2); align-items: flex-start; }
.qt { font-weight: var(--font-weight-semibold); margin: 0 0 var(--space-2); display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; flex: 1; }
.q.skipped .body { display: none; }
.q.skipped .qt { color: var(--color-text-muted); }
.kids { margin: var(--space-3) 0 0 var(--space-2); padding-left: var(--space-4); border-left: 2px solid var(--color-brand-300); }
.kids .q { border-top: 0; padding: var(--space-2) 0; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chips.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.chip { position: relative; display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; border: 1px solid var(--color-border-control);
  border-radius: var(--radius-pill); padding: var(--space-2) var(--space-4); cursor: pointer; min-height: 40px; background: var(--color-bg-surface); user-select: none; }
.cards .chip { border-radius: var(--radius-md); align-items: flex-start; padding: var(--space-3); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:hover { border-color: var(--color-action-primary); }
.chip:has(input:checked) { background: var(--color-brand-100); border-color: var(--color-action-primary); box-shadow: inset 0 0 0 1px var(--color-action-primary); }
:root[data-theme="dark"] .chip:has(input:checked) { background: var(--color-brand-dark100); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip:has(input:checked) { background: var(--color-brand-dark100); } }
.chip:has(input:focus-visible) { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.chip .lab { font-weight: var(--font-weight-medium); display: flex; gap: var(--space-1); align-items: center; flex-wrap: wrap; }
.chip:has(input:checked) .lab::before { content: "✓"; color: var(--color-text-brand); font-weight: var(--font-weight-bold); }
.chip .desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.chip .warn { font-size: var(--font-size-sm); color: var(--color-status-warning-fg); }
.chip .more { font-size: var(--font-size-xs); color: var(--color-text-muted); }
textarea, input[type=text], select { width: 100%; border: 1px solid var(--color-border-control); background: var(--color-bg-surface); border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3); min-height: 40px; }
textarea { min-height: 76px; resize: vertical; }
.other { margin-top: var(--space-2); }
.badge { font-size: var(--font-size-xs); border-radius: var(--radius-pill); padding: 1px var(--space-2); font-weight: var(--font-weight-medium); white-space: nowrap; }
.badge.prefill { background: var(--color-status-warning-bg); color: var(--color-status-warning-fg); }
.badge.ok { background: var(--color-status-success-bg); color: var(--color-status-success-fg); }
.badge.std, .badge.feeds { background: var(--color-status-info-bg); color: var(--color-status-info-fg); }
.badge.todo { background: var(--color-status-danger-bg); color: var(--color-status-danger-fg); }
.badge.rec { background: var(--color-status-success-bg); color: var(--color-status-success-fg); }
.badge.skip { background: var(--color-status-neutral-bg); color: var(--color-status-neutral-fg); }
details.help { margin: 0 0 var(--space-2); font-size: var(--font-size-sm); color: var(--color-text-secondary); }
details.help summary { cursor: pointer; color: var(--color-text-brand); width: fit-content; }
details.help p { margin: var(--space-1) 0 0; padding: var(--space-2) var(--space-3); background: var(--color-bg-subtle); border-radius: var(--radius-md); white-space: pre-line; }
.evid { margin-top: var(--space-2); font-size: var(--font-size-sm); color: var(--color-text-secondary); background: var(--color-bg-subtle);
  border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); display: flex; gap: var(--space-3); align-items: flex-start; flex-wrap: wrap; }
.evid ul { margin: 0; padding-left: var(--space-4); flex: 1; min-width: 200px; }
.hint { font-size: var(--font-size-sm); color: var(--color-text-muted); margin-top: var(--space-1); }
.switch { display: inline-flex; align-items: center; gap: var(--space-2); border: 0; background: transparent; cursor: pointer; padding: 2px; font-size: var(--font-size-sm);
  color: var(--color-text-secondary); white-space: nowrap; min-height: 32px; }
.switch .track { width: 36px; height: 20px; border-radius: var(--radius-pill); background: var(--color-border-control); position: relative; flex: 0 0 auto; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-bg-surface); transition: left .15s; }
.switch[aria-checked="true"] .track { background: var(--color-action-primary); }
.switch[aria-checked="true"] .track::after { left: 18px; }
.rows { width: 100%; border-collapse: collapse; }
.rows th, .rows td { border-bottom: 1px solid var(--color-border-subtle); padding: var(--space-1); text-align: left; font-size: var(--font-size-sm); vertical-align: top; }
.status { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
.status.draft { background: var(--color-status-neutral-bg); color: var(--color-status-neutral-fg); }
.status.complete { background: var(--color-status-success-bg); color: var(--color-status-success-fg); }
.sum h3 { margin: var(--space-4) 0 var(--space-2); font-size: var(--font-size-md); }
.sum ul { margin: 0; padding-left: var(--space-5); }

dl.terms dd { margin: 0; color: var(--color-text-secondary); }
.toast { position: fixed; bottom: var(--space-4); left: 50%; transform: translateX(-50%); background: var(--color-bg-inverse); color: var(--color-text-inverse);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); display: none; z-index: 10; max-width: calc(100vw - 32px); }
/* 색 고르기 — 견본 · 직접 지정 · 세밀 조정 · 대비 미리보기(고객이 고른 색은 값 그대로 보여 준다) */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--space-2); }
.sw { border: 1px solid var(--color-border-control); background: var(--color-bg-surface); border-radius: var(--radius-md); padding: var(--space-2);
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; min-height: 84px; }
.sw .dot { width: 100%; height: 32px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,.08); }

.custom { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; margin-top: var(--space-3); }
.custom input[type=color] { width: 48px; height: 40px; padding: 2px; border: 1px solid var(--color-border-control); border-radius: var(--radius-md); background: var(--color-bg-surface); cursor: pointer; }
.custom input[type=text] { width: 130px; font-family: var(--font-family-mono); }
.sliders { display: grid; grid-template-columns: 72px 1fr 48px; gap: var(--space-2); align-items: center; margin-top: var(--space-2); font-size: var(--font-size-sm); }
.sliders input[type=range] { width: 100%; }
.cpv { margin-top: var(--space-3); display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--space-2); }
.cpv .tile { border-radius: var(--radius-md); padding: var(--space-3); border: 1px solid var(--color-border-subtle); font-size: var(--font-size-sm); }
.cpv .sbtn { display: inline-block; padding: 6px 14px; border-radius: 8px; color: #fff; font-weight: 600; }
.cpv .ok { color: var(--color-status-success-fg); font-weight: var(--font-weight-semibold); }
.cpv .bad { color: var(--color-status-danger-fg); font-weight: var(--font-weight-semibold); }

.pv { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
.pv .box { width: 46px; height: 26px; border: 2px solid var(--color-action-primary); background: var(--color-brand-100); }

.pv .wf { width: 64px; height: 40px; border: 1px solid var(--color-border-control); border-radius: 4px; position: relative; background: var(--color-bg-surface); overflow: hidden; }
.pv .wf b { position: absolute; background: var(--color-brand-300); }
.pv .sample { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
/* 분류별 보기 묶음 · 새 미리보기(REQ-261104-18) — 색은 토큰 변수, 분위기 견본의 브랜드 색만 데이터 HEX(색 견본과 같은 방식) */
.grp + .grp { margin-top: var(--space-3); }
.grp .gh { margin: 0 0 var(--space-1); font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-muted); }
.pv .mood { box-sizing: border-box; width: 112px; display: flex; flex-direction: column; border: 1px solid var(--color-border-control); background: var(--color-bg-surface); overflow: hidden; }
.pv .mood i { display: block; flex: none; height: 4px; width: 70%; background: var(--color-border-control); border-radius: var(--radius-sm); }
.pv .mood .bar { display: block; height: 8px; flex: none; border-radius: var(--radius-sm); }
.pv .mood .cta { display: block; flex: none; width: 38px; height: 12px; align-self: flex-end; }
.pv .mood.dark { background: var(--color-neutral-900); border-color: var(--color-neutral-700); }
.pv .mood.dark i { background: var(--color-neutral-700); }
.pv.sws .sq { width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1px solid var(--color-border-subtle); }
.pv .shp { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 24px; padding: 0 var(--space-2); font-size: var(--font-size-xs); border-radius: var(--radius-md); }
.pv .shp.btn_solid { background: var(--color-action-primary); color: var(--color-action-on-primary); }
.pv .shp.btn_outline { border: 1px solid var(--color-action-primary); color: var(--color-text-brand); }
.pv .shp.btn_soft { background: var(--color-brand-100); color: var(--color-text-brand); }
.pv .shp.in_box { width: 84px; justify-content: flex-start; border: 1px solid var(--color-border-control); background: var(--color-bg-surface); color: var(--color-text-muted); }
.pv .shp.in_line { width: 84px; justify-content: flex-start; border-radius: 0; border-bottom: 1px solid var(--color-border-control); color: var(--color-text-muted); }
.pv .shp.in_fill { width: 84px; justify-content: flex-start; background: var(--color-bg-subtle); color: var(--color-text-muted); }
.pv .tb { display: grid; width: 72px; border-radius: var(--radius-sm); overflow: hidden; }
.pv .tb i { display: block; height: 8px; }
.pv .tb.tb_lines i + i { border-top: 1px solid var(--color-border-subtle); }
.pv .tb.tb_stripe i:nth-child(odd) { background: var(--color-bg-subtle); }
.pv .tb.tb_grid { border: 1px solid var(--color-border-control); }
.pv .tb.tb_grid i { background: linear-gradient(90deg, transparent 32%, var(--color-border-control) 32% 34%, transparent 34% 66%, var(--color-border-control) 66% 68%, transparent 68%); }
.pv .tb.tb_grid i + i { border-top: 1px solid var(--color-border-control); }
.pv .cd { width: 56px; height: 34px; border-radius: var(--radius-md); background: var(--color-bg-surface); }
.pv .cd.cd_both { border: 1px solid var(--color-border-subtle); box-shadow: var(--elevation-card); }
.pv .cd.cd_border { border: 1px solid var(--color-border-control); }
.pv .cd.cd_shadow { box-shadow: var(--elevation-overlay); }
.pv .cd.cd_fill { background: var(--color-bg-subtle); }
.pv .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--color-border-subtle); border-top-color: var(--color-action-primary); }
.pv .wf b.ink { background: var(--color-bg-inverse); }
.pv .wf b.ghost { background: var(--color-bg-subtle); }
/* 디자인 실시간 미리보기 */
.dpv { border: 1px dashed var(--color-border-control); border-radius: var(--radius-lg); padding: var(--space-3); margin: var(--space-3) 0 var(--space-2); }
.dpv .frame { border-radius: 10px; overflow: hidden; display: grid; min-height: 230px; border: 1px solid rgba(127,127,127,.3); }
.dpv .hd { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-weight: 700; }
.dpv .nv { display: flex; gap: 6px; padding: 8px; font-size: 13px; }
.dpv .nv span { padding: 4px 8px; border-radius: 6px; }
.dpv .ct { padding: 12px; display: grid; gap: 10px; align-content: start; }
.dpv .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dpv .card { padding: 10px; }
.dpv .tbl { display: grid; gap: 0; }
.dpv .tbl div { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 6px 8px; font-size: 13px; }
/* Nova 보기 갤러리 · 목업 채택표 */
.gl { border: 0; background: transparent; color: var(--color-text-brand); font-size: var(--font-size-xs); cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.gcard { scroll-margin-top: 90px; }
.gcard .ex { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); padding: var(--space-3); background: var(--color-bg-canvas); margin: var(--space-2) 0; }
.gcard img { max-width: 100%; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); margin-top: var(--space-2); }
.gcard ul { margin: var(--space-1) 0; padding-left: var(--space-5); }
.gx-btn { display: inline-block; padding: 6px 14px; border-radius: var(--radius-md); background: var(--color-action-primary); color: var(--color-action-on-primary); font-weight: 600; }
.gx-btn.sec { background: var(--color-bg-surface); color: var(--color-text-primary); border: 1px solid var(--color-border-control); }
.gx-tbl { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); background: var(--color-bg-surface); }
.gx-tbl th, .gx-tbl td { border-bottom: 1px solid var(--color-border-subtle); padding: 6px 8px; text-align: left; }
.gx-in { border: 1px solid var(--color-border-control); border-radius: var(--radius-md); padding: 6px 10px; background: var(--color-bg-surface); min-width: 160px; display: inline-block; }
.gx-in.err { border-color: var(--color-status-danger-fg); }
.mk { display: grid; gap: var(--space-3); }
.mk .item { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); padding: var(--space-3); }
.mk .top { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-2); }
.hidden { display: none !important; }
@media (max-width: 860px) {
  header { position: static; }
  .wrap { grid-template-columns: 1fr; padding: var(--space-3) var(--space-4); }
  nav ol { position: static; display: flex; overflow-x: auto; gap: var(--space-1); max-height: none; }
  nav li { flex: 0 0 auto; }
  nav button { white-space: nowrap; }
  .bar { width: 90px; }
  dl.terms { grid-template-columns: 1fr; }
  .rows thead { display: none; }
  .rows tr { display: grid; gap: var(--space-1); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border-subtle); }
  .rows td { border: 0; }
}

<body>
<header>

  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    nav.append(el("li", { class: c.off ? "off" : c.done === c.total ? "done" : "" }, b));
  }
  if (!activeQs(TREE.sections.find(s => s.id === st.current) || TREE.sections[0]).length && !secOff(st.current)) st.current = TREE.sections.find(s => activeQs(s).length).id;
  const pct = T ? Math.round(D * 100 / T) : 0;
  document.getElementById("bar").style.width = pct + "%";
  document.querySelector("[role=progressbar]").setAttribute("aria-valuenow", pct);
  document.getElementById("progress").textContent = `${D}/${T} 채움`;
  for (const [id, on] of [["fAll", st.filter === "all"], ["fTodo", st.filter === "todo"]]) document.getElementById(id).setAttribute("aria-pressed", on);
  document.getElementById("tabSum").textContent = st.view === "sum" ? "질문으로 돌아가기" : "요약 보기";
  document.getElementById("tabTerms").textContent = st.view === "terms" ? "질문으로 돌아가기" : "용어 풀이";
  document.getElementById("tabNova").textContent = st.view === "nova" ? "질문으로 돌아가기" : "Nova 보기";
  const main = document.getElementById("main"); main.replaceChildren(statusBox(D, T));
  if (st.view === "sum") { main.append(summary()); return; }
  if (st.view === "terms") { main.append(terms()); return; }
  if (st.view === "nova") { main.append(novaGallery()); if (st.focus) { const c = document.getElementById("g-" + st.focus); if (c) setTimeout(() => c.scrollIntoView({ block: "start" }), 0); st.focus = ""; } return; }
  const secs = st.filter === "todo" ? TREE.sections.filter(s => !secOff(s.id)) : TREE.sections.filter(s => s.id === st.current);
  for (const s of secs) {
    let qs = s.questions.filter(visible);
    if (st.filter === "todo") qs = qs.filter(q => activeQs({ questions: [q] }).some(needs));
    if (!qs.length && (st.filter === "todo" || !secOff(s.id))) continue;
    const off = secOff(s.id);
    const head = el("div", { class: "sechead" }, el("div", { class: "grow" }, el("h2", { id: "s-" + s.id }, s.title), el("p", { class: "muted", style: "margin:4px 0 0" }, s.hint || "")),
      sw(off ? "이 섹션 건너뜀" : "이 섹션 답하기", !off, () => { touch(); st.offSections = off ? st.offSections.filter(x => x !== s.id) : [...st.offSections, s.id]; persist(); render(); },
        "답하기 어려운 섹션은 끄고 넘어가세요 — 나중에 인터뷰로 묻습니다"));
    main.append(el("section", { class: "card" + (off ? " off" : ""), "aria-labelledby": "s-" + s.id }, head, off ? el("p", { class: "muted" }, "이 섹션은 건너뛰었습니다. 스위치를 켜면 다시 답할 수 있습니다.") : help(s.help),
      !off && s.preview && st.filter === "all" ? designPreview() : null,
      qs.map((q, i) => questionNode(q, i === 0))));
  }
  if (!main.querySelector("section")) main.append(el("section", { class: "card" }, el("h2", {}, "모두 채웠습니다"), el("p", {}, "요약을 확인하고 [완료하고 제출]을 누르세요.")));
  if (st.filter === "all") {
    const order = TREE.sections.filter(s => secOff(s.id) || activeQs(s).length);
    const nx = order[order.findIndex(s => s.id === st.current) + 1];
    if (nx) main.append(el("button", { type: "button", class: "btn primary", onclick: () => { st.current = nx.id; persist(); render(); window.scrollTo(0, 0); } }, `다음: ${nx.title} →`));
  }
}
function statusBox(D, T) {
  const done = st.status === "complete";
  return el("div", { class: "status " + st.status },
    el("span", {}, done ? "✅ 제출됨(완료) — 이 내용으로 요구 분석에 반영됩니다." : "✏️ 작성중 — [임시저장] 후 언제든 이어서 쓸 수 있습니다. 다 되면 [완료하고 제출]."),
    st.file ? el("span", { class: "muted" }, `파일 ${st.file} · 판 ${st.revision}${st.saved ? " · " + st.saved : ""}`) : null,
    done ? el("button", { type: "button", class: "btn sm", onclick: () => { st.status = "draft"; persist(); render(); } }, "작성중으로 되돌리기") : null);
}
function label(q, a) {
  if (!has(a)) return "—";
  if (a.state === "unknown") return "건너뜀 · 나중에";
  if (q.type === "text") return a.value;
  if (q.type === "mockups") return Object.entries(a.value).filter(([, x]) => x.level).map(([f, x]) => `${f}: ${((TREE.mockup_levels || []).find(l => l.id === x.level) || {}).label || x.level}${x.note ? "(" + x.note + ")" : ""}`).join(" / ");
  if (q.type === "color") { const p = q.presets.find(x => x.id === a.value.preset); return `${p ? p.label : "직접 지정"} ${a.value.hex}${a.value.text_hex && a.value.text_hex !== a.value.hex ? ` (글자용 ${a.value.text_hex})` : ""}`; }
  if (q.type === "rows") return a.value.map(r => q.columns.map(c => c.type === "one" ? ((c.options.find(o => o.id === r[c.id]) || {}).label || "") : (r[c.id] || "")).filter(Boolean).join(" · ")).join(" / ");
  const vals = Array.isArray(a.value) ? a.value : [a.value];
  return vals.map(v => { const o = q.options.find(o => o.id === v); return o ? (o.other && a.other ? `${o.label}(${a.other})` : o.label) : v; }).join(", ");
}
function summary() {
  const box = el("section", { class: "card sum" }, el("h2", {}, "요약"));
  const todo = [];
  for (const s of TREE.sections) {
    if (secOff(s.id)) { box.append(el("h3", {}, s.title), el("p", { class: "muted" }, "건너뜀")); continue; }
    if (!activeQs(s).length) continue;
    const ul = el("ul");
    (function walk(qs, ul) {
      for (const q of qs) {
        if (!visible(q)) continue;
        const a = st.answers[q.id];
        if (needs(q)) todo.push(`${s.title} — ${q.q}`);
        const li = el("li", {}, `${q.q} → ${label(q, a)}`, a && a.state === "prefill" ? " (자료에서 채움 · 확인 전)" : "");
        const sub = el("ul");
        for (const o of q.options || []) if (o.children && chosen(q.id, o.id)) walk(o.children, sub);
        if (sub.children.length) li.append(sub);
        ul.append(li);
      }
    })(s.questions, ul);
    box.append(el("h3", {}, s.title), ul);
  }
  box.prepend(el("p", {}, todo.length ? `채우거나 확인할 것 ${todo.length}개 — [채울 것만]으로 모아 볼 수 있습니다.` : "모든 질문에 답했습니다."));
  return box;
}
function terms() {
  const box = el("section", { class: "card" }, el("h2", {}, "용어 풀이"), el("p", { class: "muted" }, "질문에 나오는 어려운 말을 쉽게 풀었습니다."));
  const q = el("input", { type: "text", "aria-label": "용어 찾기", placeholder: "찾을 말 — 예: 배포" });
  const dl = el("dl", { class: "terms" });
  const fill = () => { dl.replaceChildren(); for (const g of TREE.glossary || []) if (!q.value || (g.term + g.desc).includes(q.value)) dl.append(el("dt", {}, g.term), el("dd", {}, g.desc)); };
  q.addEventListener("input", fill); fill();
  const badges = Object.entries(TREE.badges || {}).map(([k, v]) => el("li", {}, el("span", { class: "badge rec" }, k), " ", v));
  box.append(q, el("div", { style: "height:12px" }), dl, el("h3", {}, "표시 뜻"), el("ul", {}, badges,
    el("li", {}, el("span", { class: "badge prefill" }, "자료에서 채움"), " 받은 자료에서 찾은 답 — 맞으면 [맞아요]"),
    el("li", {}, el("span", { class: "badge feeds" }, "기술 결정"), " 기반 설계(/foundation)에 쓰입니다"),
    el("li", {}, el("span", { class: "badge skip" }, "건너뜀"), " 스위치로 넘긴 질문 — 나중에 인터뷰로 묻습니다")));
  return box;
}

function exportDoc(status) {
  const answers = {};
  // 단계(기본/자세히/전문가)를 낮춰도 답한 것은 남긴다 — 빠지는 것은 부모 보기를 풀었거나 섹션을 건너뛴 답뿐
  for (const [id, a] of Object.entries(st.answers)) { const q = Q[id]; const sid = TREE.sections.find(s => id.startsWith(s.id + ".")).id;
    if (!q || secOff(sid) || !parentOk(q) || !has(a)) continue;
    answers[id] = { value: a.value, other: a.other || "", note: a.note || "", state: a.state, evidence: a.evidence || [] }; }
  const now = new Date();
  const iso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 19);
  return { form: "nova-checklist", tree_version: TREE.version, status, revision: st.revision + 1,
    created: st.created || iso.slice(0, 10), updated: iso, file: st.file, lv: st.lv, skipped_sections: st.offSections.slice(), answers };
}
async function save(status) {
  const doc = exportDoc(status);
  const after = name => { Object.assign(st, { file: name, revision: doc.revision, created: doc.created, status, saved: `${stamp()} 저장` }); persist(); render(); };
  if (SERVER) {
    try {
      const r = await fetch("api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(doc) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error && j.error.message || r.status);
      after(j.file);
      toast(status === "complete" ? `제출했습니다 — ${j.file}.json · .md` : `임시저장했습니다 — ${j.file}.json · .md (이어서 쓰면 같은 파일에 저장)`); return;
    } catch (e) { toast("저장소 저장 실패 — 파일로 내려받습니다 (" + e.message + ")"); }
  }
  const name = doc.file || `checklist_${doc.created.replaceAll("-", "")}_01`;
  doc.file = name;
  const url = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" }));
  el("a", { href: url, download: name + ".json" }).click(); URL.revokeObjectURL(url);
  after(name);
  toast(status === "complete" ? `${name}.json 을 내려받았습니다 — 보내 주시면 됩니다` : `임시저장: ${name}.json 을 내려받았습니다. 이 브라우저에서 다시 열면 이어지고, 다른 PC 에서는 [불러오기]로 이어 갑니다`);
}
function loadDoc(doc) {
  if (!doc || doc.form !== "nova-checklist") { toast("체크리스트 파일이 아닙니다"); return; }
  const answers = {};
  for (const [id, a] of Object.entries(doc.answers || {})) if (Q[id]) answers[id] = a;
  prefillInto(answers);
  Object.assign(st, { answers, offSections: doc.skipped_sections || [], status: doc.status || "draft", revision: doc.revision || 0, created: doc.created || "", file: doc.file || "", lv: doc.lv || st.lv, saved: "" });
  persist(); render(); toast(`불러왔습니다 — ${doc.file || "파일"} (판 ${doc.revision || 0}) · 이어서 쓰세요`);
}
document.getElementById("draft").onclick = () => save("draft");
document.getElementById("submit").onclick = () => {
  let T = 0, D = 0; for (const s of TREE.sections) { const c = counts(s); T += c.total; D += c.done; }
  if (D < T && !confirm(`아직 ${T - D}개가 비었거나 확인 전입니다. 그래도 제출할까요? (빈 것은 나중에 다시 묻습니다)`)) return;
  save("complete");
};
document.getElementById("load").onclick = async () => {
  if (SERVER) { try { const r = await fetch("api/latest"); if (r.ok) { const j = await r.json(); if (j && j.form) return loadDoc(j); } } catch (e) {} }
  document.getElementById("file").click();
};
document.getElementById("file").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { loadDoc(JSON.parse(t)); } catch (x) { toast("읽을 수 없는 파일입니다"); } }); };
document.getElementById("fAll").onclick = () => { st.filter = "all"; persist(); render(); };
document.getElementById("fTodo").onclick = () => { st.filter = "todo"; st.view = "form"; persist(); render(); };
document.getElementById("tabSum").onclick = () => { st.view = st.view === "sum" ? "form" : "sum"; render(); window.scrollTo(0, 0); };
document.getElementById("tabTerms").onclick = () => { st.view = st.view === "terms" ? "form" : "terms"; render(); window.scrollTo(0, 0); };
document.getElementById("tabNova").onclick = () => { st.view = st.view === "nova" ? "form" : "nova"; render(); window.scrollTo(0, 0); };
render();
if (st.saved || Object.values(st.answers).some(a => a.state !== "prefill")) toast("이전에 쓰던 내용을 불러왔습니다 — 이어서 쓰세요");
</script>
</body>
