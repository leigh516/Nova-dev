[project]
name = "nova-common"
version = "0.1.0"
description = "Nova 공통 라이브러리: 서비스 팩토리 · 이벤트 버스(Kafka/메모리) · 트랜잭셔널 아웃박스 · 멱등 소비 · DB · JWT · Prometheus 메트릭 · 서비스 카탈로그"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "aiokafka>=0.11",
  "pymysql>=1.1",
  "alembic>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova_common"]
