{{- /*
서비스 단위 NetworkPolicy — k3s base networkpolicy.yaml(scripts/gen_k3s.py netpols())과 같은 정책.
입력은 values.yaml(생성물 — services.json k8s.allow_from)에서만 온다. 이 템플릿에 서비스 이름 · 네임스페이스를 적지 않는다.
서비스는 게이트웨이가 붙인 x-user-id · x-role 헤더를 믿는다 — 이 정책이 없으면 아무 파드나 그 헤더로 서비스를 직접 부른다.
네임스페이스는 차트가 만들지 않으므로 API 서버가 붙이는 kubernetes.io/metadata.name 라벨로 고른다(사용자 라벨이 없어도 막히지 않게).
같은 from 원소 안의 namespaceSelector + podSelector 는 AND — 그 네임스페이스의 그 파드만 들인다(네임스페이스 통째 허용 없음).
*/}}
{{- $np := .Values.networkPolicy }}
{{- if $np.enabled }}
{{- range $ns := $np.namespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: {{ $ns }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
{{- end }}
{{- range $name, $s := .Values.services }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-{{ $name }}, namespace: {{ $s.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ $name }}}}
  policyTypes: [Ingress]
  ingress:
  - from:
    {{- if $s.gateway }}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.ingressNamespace }}}}
    {{- end }}
    {{- range $p := $s.ingressFrom }}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $p.namespace }}}}
      podSelector: {matchLabels: {app: {{ $p.app }}}}
    {{- end }}
    {{- /* 관측 네임스페이스 안에서도 observedBy 파드만(백엔드 prometheus · 게이트웨이 + alertmanager) — Grafana 등은 못 부른다 */}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $np.observabilityNamespace }}}}
      podSelector: {matchExpressions: [{key: app, operator: In, values: {{ toJson $s.observedBy }}}]}
    ports: [{port: 8000}]
---
{{- end }}
{{- end }}
