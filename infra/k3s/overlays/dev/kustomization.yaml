# 생성 파일 — scripts/gen_k3s.py (services.json · nova.project.json). 직접 고치지 않는다.
# 개발(단일 노드 k3s): 레플리카 1, HPA 상한 2 — 노트북 · 소형 VM 에서 전체가 뜨도록
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base, ../../../observability]
patches:
- target: {kind: HorizontalPodAutoscaler}
  patch: |-
    - {op: replace, path: /spec/maxReplicas, value: 2}
