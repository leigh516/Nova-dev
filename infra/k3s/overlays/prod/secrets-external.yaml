# 생성 파일 — scripts/gen_k3s.py (services.json · nova.project.json). 직접 고치지 않는다.
# 비밀값은 저장소에 두지 않는다 — ClusterSecretStore(nova-secrets: Vault · 클라우드 Secret Manager 등)에서 동기화
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: nova-db-sample, namespace: core}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: nova-secrets}
  target: 
    name: nova-db-sample
    creationPolicy: Owner
    template:
      engineVersion: v2
      data: {url: "mysql+pymysql://sample:{{ .password | urlquery }}@mariadb.infra.svc.cluster.local:3306/sample?charset=utf8mb4"}
  data:
  - {secretKey: password, remoteRef: {key: nova/prod/core/nova-db-sample, property: password}}
---
