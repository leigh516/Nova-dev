# 생성 파일 — scripts/gen_k3s.py (services.json · nova.project.json). 직접 고치지 않는다.
# 개발용 값. 운영은 overlays/prod 가 이 시크릿을 지우고 ExternalSecret 으로 대체한다(기본 JWT 키면 서비스가 기동 거부)
apiVersion: v1
kind: Secret
metadata:
  name: nova-db-sample
  namespace: core
type: Opaque
stringData:
  url: "mysql+pymysql://sample:dev-sample-pw@mariadb.infra.svc.cluster.local:3306/sample?charset=utf8mb4"
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-auth
  namespace: core
type: Opaque
stringData:
  jwt-secret: "nova-dev-secret-change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-auth
  namespace: edge
type: Opaque
stringData:
  jwt-secret: "nova-dev-secret-change-me"
---
