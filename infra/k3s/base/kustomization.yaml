# 생성 파일 — scripts/gen_k3s.py (services.json · nova.project.json). 직접 고치지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs: {app.kubernetes.io/part-of: nova, app.kubernetes.io/managed-by: kustomize}
  includeTemplates: true
resources:
- namespaces.yaml
- configmap-common.yaml
- networkpolicy.yaml
- secrets-dev.yaml
- svc-sample.yaml
- svc-gateway.yaml
- web-app.yaml
- kafka.yaml
- mariadb.yaml
- ingress.yaml
configMapGenerator:
- name: kafka-topics
  namespace: infra
  files: [kafka-topics.txt]
- name: mariadb-init
  namespace: infra
  files: [mariadb-init.sql]
generatorOptions:
  disableNameSuffixHash: true
