# 생성 파일 — scripts/gen_k3s.py (services.json · nova.project.json). 직접 고치지 않는다.
# Prometheus — docker-compose 용: 정적 대상(job 라벨 = 서비스 이름). k3s 는 prometheus.yml
# 자원 효율: 스크레이프 15s, 고카디널리티 라벨(route 외 경로) 금지 규약
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {cluster: nova}
rule_files:
- /etc/prometheus/*rules*.yml   # recording_rules(손) · alert_rules(생성) · business_rules(손, 프로젝트 업무)
alerting:
  alertmanagers:
  - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
- job_name: compose
  static_configs:
  - {targets: ["sample:8000"], labels: {job: sample}}
  - {targets: ["gateway:8000"], labels: {job: gateway}}
