apiVersion: v1
kind: Secret
metadata: {name: grafana-admin}
type: Opaque
stringData: {user: admin, password: grafana-dev-pw}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
      - name: grafana
        image: grafana/grafana:11.3.0
        env:
        - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: grafana-admin, key: user}}}
        - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}}
        - {name: PROMETHEUS_URL, value: "http://prometheus.observability.svc.cluster.local:9090"}
        - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
        - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
        - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
        - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/platform-overview.json}
        - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
        ports: [{name: http, containerPort: 3000}]
        resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
        readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
        volumeMounts:
        - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
        - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
      - {name: ds, configMap: {name: grafana-datasources}}
      - {name: provider, configMap: {name: grafana-dashboard-provider}}
      - {name: dashboards, configMap: {name: grafana-dashboards}}
