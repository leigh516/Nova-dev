apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: observability-prometheus}
rules:
- {apiGroups: [""], resources: [pods, services, endpoints, nodes, nodes/metrics], verbs: [get, list, watch]}
- {nonResourceURLs: [/metrics], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: observability-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: observability-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: observability}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, labels: {app: prometheus}}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: prometheus, labels: {app: prometheus}}
spec:
  serviceName: prometheus
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=2GB
        - --web.enable-lifecycle
        ports: [{name: http, containerPort: 9090}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
        readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 10}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
        - {name: data, mountPath: /prometheus}
      volumes: [{name: config, configMap: {name: prometheus-config}}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 4Gi}}}
