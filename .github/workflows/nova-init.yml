# Nova 템플릿에서 시작하기 — 'Use this template' 으로 만든 저장소에서 한 번 돌린다.
# Actions 탭 → "Nova 프로젝트 초기화" → Run workflow → 이름 · slug 입력.
# 하는 일: scripts/template_init.py(= new-project 와 같은 결과를 이 저장소 자리에) → 커밋 · 푸시.
# Nova 원천 저장소에서는 도구가 거부한다(원천의 기록을 지우지 않게).
name: Nova 프로젝트 초기화

on:
  workflow_dispatch:
    inputs:
      name:
        description: "프로젝트 이름(예: 쇼핑몰)"
        required: true
      slug:
        description: "영문 소문자 slug(예: shop) — 패키지 · 이미지 · 도메인에 쓰인다"
        required: true
      owner:
        description: "요구 요청자 이름(비우면 Nova 기본값)"
        required: false

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: 의존성 설치
        run: uv sync --all-packages
      - name: 초기화
        # 입력은 셸 본문에 직접 넣지 않고 환경 변수로만 받는다 — `${{ }}` 를 run 에 쓰면 이름 칸에 셸 명령을 넣을 수 있다(명령 주입)
        env:
          PYTHONIOENCODING: utf-8
          IN_NAME: ${{ inputs.name }}
          IN_SLUG: ${{ inputs.slug }}
          IN_OWNER: ${{ inputs.owner }}
        run: |
          case "$IN_NAME$IN_SLUG$IN_OWNER" in *$'\n'*|*$'\r'*) echo "✗ 입력에 줄바꿈이 있다 — 한 줄로 넣는다"; exit 1;; esac
          args=(--name "$IN_NAME" --slug "$IN_SLUG")
          if [ -n "$IN_OWNER" ]; then args+=(--owner "$IN_OWNER"); fi
          uv run python scripts/template_init.py "${args[@]}"
      - name: 검사(lint)
        run: uv run python nova.py lint
      - name: 커밋 · 푸시
        env:
          IN_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(init): Nova 템플릿에서 $IN_NAME 프로젝트 초기화"
          git push
